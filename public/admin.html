<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Loopvity 管理控制台</title>
  <link rel="icon" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --ink: #1a1c1f;
      --muted: #61656c;
      --line: #e3e5e8;
      --line-strong: #d0d4da;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --nav: #f7f8f9;
      --active: #e7f3f1;
      --ok: #067647;
      --ok-bg: #e7f6ee;
      --warn: #b54708;
      --warn-bg: #fef4e6;
      --danger: #b42318;
      --danger-bg: #fdeceb;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Noto Sans TC", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    h2 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(15, 118, 110, .12), transparent 60%),
        var(--bg);
    }
    .login-card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 40px 40px 36px; box-shadow: 0 16px 40px rgba(16, 24, 40, .06); }
    .brand-lockup { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-lockup img { height: 36px; width: auto; }
    .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
    aside {
      background: var(--nav);
      border-right: 1px solid var(--line);
      padding: 20px 14px 16px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .side-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px 12px 20px; }
    .side-brand img { height: 32px; width: auto; }
    .side-brand span { font-weight: 650; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
    .nav-label { margin: 14px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8b9098; }
    .link {
      display: flex; align-items: center; gap: 10px;
      width: 100%; text-align: left; background: transparent; color: #30343a;
      border: 0; border-radius: 8px; padding: 10px 12px; margin: 2px 0; font-weight: 550;
    }
    .link svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .link:hover { background: #eceef1; }
    .link.active { background: var(--active); color: #0f5f59; font-weight: 700; }
    .side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
    main.pad { padding: 32px 40px 64px; max-width: none; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
    .page-head p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    td .actions { flex-wrap: nowrap; gap: 12px; }
    td:last-child, th:last-child { white-space: nowrap; width: 1%; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .card + .card { margin-top: 0; }
    .section-head { margin-bottom: 18px; }
    .section-head p, .help { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
    .stat span { display: block; color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .stat b { display: block; font-size: 30px; letter-spacing: -0.03em; line-height: 1; }
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 14px 18px; font-size: 12px; font-weight: 700; color: var(--muted); background: #fafbfc; border-bottom: 1px solid var(--line); }
    td { padding: 16px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .title-cell { font-weight: 650; }
    .muted { color: var(--muted); }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .list-toolbar { display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: #fafbfc; }
    .text-action { border: 0; background: transparent; color: #0f5f59; font-weight: 650; padding: 6px 0; box-shadow: none; min-height: 0; }
    .text-action:hover { text-decoration: underline; }
    .select-bar { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .select-bar[hidden] { display: none; }
    .page-card { display: flex; align-items: flex-start; gap: 8px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .page-card.dragging { position: relative; z-index: 2; opacity: .92; box-shadow: 0 12px 28px rgba(16, 24, 40, .12); background: #fff; }
    .drag-handle { width: 28px; margin-top: 2px; border: 0; background: transparent; color: #9aa1ab; cursor: grab; display: grid; place-items: center; padding: 8px 0; box-shadow: none; }
    .drag-handle svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
    .card-body { flex: 1; min-width: 0; }
    .page-card:last-child { border-bottom: 0; }
    .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .card-heading { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .card-heading h3, .card-top h3 { margin: 0; font-size: 16px; letter-spacing: -0.02em; min-width: 0; }
    .lang-toggle { display: inline-flex; align-items: center; padding: 3px; background: #eef0f3; border-radius: 999px; flex: none; }
    .lang-toggle button { border: 0; background: transparent; min-height: 28px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #61656c; box-shadow: none; }
    .lang-toggle button.on { background: #fff; color: #111827; box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }
    .lang-line.active { background: #fff; }
    .edit-title-row { display: flex; align-items: flex-start; gap: 16px; }
    .edit-title-row .writer-title { flex: 1; margin-top: 24px; }
    .edit-title-row .lang-toggle { margin-top: 32px; }
    .move-pair { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
    .move-pair button { width: 34px; height: 32px; border: 0; background: #fff; color: #3f4650; display: grid; place-items: center; }
    .move-pair button + button { border-left: 1px solid var(--line); }
    .move-pair button:hover:not(:disabled) { background: #f3faf8; color: #0f5f59; }
    .move-pair button:disabled { color: #c5cad3; cursor: default; }
    .move-pair svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .lang-panel { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fafbfc; }
    .lang-line { display: grid; grid-template-columns: 18px minmax(140px, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 12px; }
    .lang-line[hidden], .page-card[hidden] { display: none !important; }
    .lang-line + .lang-line { border-top: 1px solid var(--line); }
    .lang-name { font-size: 12px; font-weight: 700; color: #0f5f59; }
    .lang-url { color: var(--muted); font-size: 13px; }
    .pick-label { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-weight: 650; color: #3f4650; }
    input.pick { width: 16px; height: 16px; padding: 0; margin: 0; border-radius: 4px; accent-color: #0f766e; box-shadow: none; }
    .page-thumb, .page-mark { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: #e7f3f1; display: grid; place-items: center; font-size: 18px; flex: none; }
    .field { margin-bottom: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
    .row.three { grid-template-columns: 1.2fr .8fr .8fr; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 11px 12px; background: #fff; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, .15); }
    textarea { min-height: 120px; resize: vertical; }
    textarea.code { min-height: 360px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.55; }
    .btn, .btn-primary, .btn-secondary, .btn-danger, .btn-plain, a.btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
      font-weight: 650; font-size: 14px; line-height: 1; white-space: nowrap; text-decoration: none;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }
    .btn-sm, a.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
    .btn-block { width: 100%; margin-top: 8px; }
    .btn-primary { background: #111827; color: #fff; }
    .btn-primary:hover { background: #000; text-decoration: none; }
    .btn-secondary, a.btn-secondary { background: #fff; border-color: #d0d4da; color: #1a1c1f; }
    .btn-secondary:hover, a.btn-secondary:hover { background: #f7f8f9; border-color: #b8bec7; text-decoration: none; }
    .btn-danger { background: #fff; color: #b42318; border-color: #f3c4c0; box-shadow: none; }
    .btn-danger:hover { background: #fdeceb; }
    .btn-plain { background: transparent; color: var(--muted); padding: 0 4px; box-shadow: none; min-height: 36px; }
    .btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-danger:focus-visible, a.btn-secondary:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(15, 118, 110, .22); }
    .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(17, 24, 39, .45); }
    .modal[hidden] { display: none; }
    .modal-card { width: min(440px, 100%); background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 24px 60px rgba(16, 24, 40, .18); }
    .modal-card h2 { font-size: 18px; }
    .modal-card .actions { justify-content: flex-end; margin-top: 22px; }
    .banner { border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-weight: 600; }
    .banner.ok { background: var(--ok-bg); color: var(--ok); }
    .banner.err { background: var(--danger-bg); color: var(--danger); }
    .steps { display: grid; gap: 14px; margin: 8px 0 0; padding: 0; list-style: none; }
    .steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
    .num { width: 28px; height: 28px; border-radius: 999px; background: var(--active); color: #0f5f59; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .media-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .media-card img, .media-card video { width: 100%; height: 140px; object-fit: cover; background: #eef0f3; display: block; }
    .media-card p { margin: 0; padding: 12px 14px 14px; font-size: 12px; color: var(--muted); word-break: break-all; }
    .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
    .list-search { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .list-search svg { width: 18px; height: 18px; stroke: #8b9098; fill: none; stroke-width: 1.8; flex: none; }
    .list-search input { border: 0; padding: 6px 0; background: transparent; box-shadow: none; }
    .list-search input:focus { border: 0; box-shadow: none; }
    body.studio-mode .shell { display: block; }
    body.studio-mode .shell > aside { display: none; }
    body.studio-mode main.pad { padding: 0; max-width: none; }
    .studio { height: 100vh; display: flex; flex-direction: column; background: #e7e9ee; }
    .studio-top { height: 60px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 18px; }
    .studio-top strong { font-size: 15px; }
    .studio-top .spacer { flex: 1; }
    .studio-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .block-bar { position: relative; z-index: 25; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .block-bar select, .block-bar input[type="color"] { width: auto; padding: 7px 8px; }
    .block-bar input[type="color"] { width: 36px; height: 34px; padding: 3px; }
    .bar-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; font-weight: 700; }
    .bar-btn:hover { border-color: #0f766e; background: #f3faf8; }
    .bar-btn:disabled, .block-bar select:disabled, .block-bar input:disabled { opacity: .45; }
    .swatches { display: flex; gap: 6px; }
    .swatches button { width: 18px; height: 18px; border-radius: 999px; border: 1px solid rgba(15,23,42,.16); padding: 0; }
    .inserter { position: absolute; top: calc(100% + 6px); left: 16px; width: min(460px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 40px rgba(16,24,40,.12); padding: 14px; z-index: 40; }
    .inserter[hidden] { display: none; }
    .inserter input { margin-bottom: 12px; }
    .inserter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 360px; overflow: auto; }
    .inserter-grid button { text-align: left; }
    .studio-canvas { width: 100%; flex: 1; min-height: 0; border: 0; background: #fff; }
    .settings-drawer { position: fixed; top: 112px; right: 0; bottom: 0; width: min(440px, 100%); background: #f6f7f9; border-left: 1px solid var(--line); z-index: 30; overflow: auto; padding: 20px 20px 40px; box-shadow: -12px 0 30px rgba(16,24,40,.08); }
    .settings-drawer[hidden] { display: none; }
    .drop { border: 1.5px dashed var(--line-strong); border-radius: 12px; background: #fafbfc; min-height: 120px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; cursor: pointer; }
    .drop.over { border-color: var(--accent); background: #e7f3f1; }
    .drop img, .drop video { max-width: 100%; max-height: 140px; border-radius: 8px; }
    .writer-top { margin-bottom: 16px; }
    .writer-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      padding: 6px; background: #f7f8f9; border: 1px solid var(--line); border-radius: 12px;
    }
    .tool-group { display: flex; align-items: center; gap: 2px; }
    .tool-sep { width: 1px; align-self: stretch; background: var(--line-strong); margin: 4px 6px; }
    .writer-bar button, .writer-bar select {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; border: 0; background: transparent; border-radius: 8px;
      padding: 0 10px; font-weight: 650; font-size: 13px; color: #3f4650; white-space: nowrap;
    }
    .writer-bar button svg { width: 16px; height: 16px; flex: none; }
    .writer-bar button svg path, .writer-bar button svg rect { stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .writer-bar button svg .solid { fill: currentColor; stroke: none; }
    .writer-bar button:hover, .writer-bar select:hover { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
    .writer-bar .mark { width: 34px; padding: 0; font-family: Georgia, "Noto Serif TC", serif; font-size: 15px; }
    .writer-bar select { width: auto; padding-right: 8px; }
    .writer-bar label { display: inline-flex; margin: 0; }
    .color-swatch { position: relative; width: 34px; height: 34px; border-radius: 8px; align-items: center; justify-content: center; }
    .color-swatch:hover { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
    .color-swatch .color-a { font-family: Georgia, serif; font-weight: 700; font-size: 15px; line-height: 1; border-bottom: 3px solid #111827; pointer-events: none; }
    .writer-bar input[type="color"] {
      position: absolute; inset: 0; width: 34px; height: 34px; padding: 0; border: 0; opacity: 0; cursor: pointer;
    }
    .doc-del {
      position: absolute; right: 10px; top: 8px; height: 28px; padding: 0 10px;
      border: 1px solid #f3d0cd; background: #fff; color: #b42318; border-radius: 8px;
      font-size: 12px; font-weight: 700;
    }
    .doc-del:hover { background: #fdeceb; }
    .doc-quote { margin: 0; padding-left: 14px; border-left: 3px solid #d0d4da; color: #3f4650; }
    .writer-stats { margin-left: auto; padding: 0 10px; color: #9aa1ab; font-size: 13px; white-space: nowrap; }
    .editor-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .editor-tabs button { border: 1px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 700; color: #3f4650; }
    .editor-tabs button.on { background: #1a1c1f; border-color: #1a1c1f; color: #fff; }
    .editor-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; }
    .writer-title { font-size: 28px; font-weight: 650; line-height: 1.4; outline: none; margin: 32px 4px 28px; color: #111827; }
    .writer-title:empty::before { content: attr(data-placeholder); color: #c5cad3; }
    .doc-layout { display: block; }
    .doc-card { position: relative; }
    .doc { background: #fff; border: 1px solid var(--line); border-radius: 16px; min-height: 440px; padding: 28px 32px 48px; }
    .doc-block { position: relative; padding: 6px 72px 6px 40px; border-radius: 10px; }
    .doc-block.active { background: #f4fbf9; }
    .doc-plus { position: absolute; left: 6px; top: 8px; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 700; color: #52605c; }
    .doc-plus:hover, .doc-block.active .doc-plus { border-color: #0f766e; color: #0f5f59; }
    .doc-text, .doc-list li, .doc-table input { outline: none; }
    .doc-text { min-height: 1.7em; line-height: 1.75; white-space: pre-wrap; }
    .doc-text:empty::before { content: attr(data-placeholder); color: #9aa1ab; }
    .doc-list { margin: 0; padding-left: 1.25rem; }
    .doc-list li { min-height: 1.6em; line-height: 1.7; }
    .doc-rule { border: 0; border-top: 1px solid #d7dbe2; margin: 14px 0; }
    .doc-side { position: sticky; top: 24px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .size-row, .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .size-row button, .slash-menu button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; font-weight: 700; }
    .size-row button.on { border-color: #0f766e; background: #f3faf8; color: #0f5f59; }
    .slash-menu { position: absolute; z-index: 20; width: 180px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(16,24,40,.12); padding: 6px; display: grid; gap: 4px; }
    .slash-menu[hidden] { display: none; }
    .slash-menu button { text-align: left; }
    .slash-menu button:hover { border-color: #0f766e; background: #f3faf8; }
    @media (max-width: 800px) { .doc-layout { grid-template-columns: 1fr; } }
    .advanced { padding: 0; }
    .advanced summary { padding: 16px 20px; cursor: pointer; font-weight: 700; }
    .advanced .inner { padding: 0 20px 20px; }
    @media (max-width: 800px) { .block-bar { align-items: flex-start; } .settings-drawer { top: 0; } }
    .back { display: inline-flex; margin-bottom: 10px; color: var(--muted); font-weight: 650; font-size: 13px; }
    code { background: #eef0f3; border-radius: 6px; padding: 1px 6px; font-size: 12px; }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .side-nav { display: flex; gap: 6px; overflow: auto; }
      .nav-label, .side-foot { display: none; }
      .link { width: auto; white-space: nowrap; }
      main.pad { padding: 24px 16px 48px; }
      .stats, .row, .row.three { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; }
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const app = document.getElementById("app");
    const decode = (s) => String(s ?? "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, "\"");
    const esc = (s) => decode(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const api = async (url, opts = {}) => {
      const res = await fetch(url, { credentials: "same-origin", headers: { "content-type": "application/json", ...(opts.headers || {}) }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "無法完成這項操作");
      return data;
    };
    const icon = {
      dash: '<svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',
      pages: '<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h6"/></svg>',
      posts: '<svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg>',
      media: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-4-4 3-2-2-7 5"/></svg>',
      messages: '<svg viewBox="0 0 24 24"><path d="M4 6h16v10H7l-3 3z"/></svg>',
      settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>',
      out: '<svg viewBox="0 0 24 24"><path d="M10 7V5a1 1 0 0 1 1-1h8v16h-8a1 1 0 0 1-1-1v-2"/><path d="M4 12h11M12 8l4 4-4 4"/></svg>'
    };

    function layout(active, body) {
      document.body.classList.remove("studio-mode");
      const item = (id, label) => `<button class="link ${active === id ? "active" : ""}" data-go="${id}">${icon[id] || ""}${label}</button>`;
      app.innerHTML = `<div class="shell">
        <aside>
          <div class="side-brand"><img src="/logo.png" alt=""><span>管理控制台</span></div>
          <div class="side-nav">
            <div class="nav-label">營運</div>
            ${item("dash", "概覽")}
            <div class="nav-label">內容</div>
            ${item("pages", "頁面")}
            ${item("posts", "網誌文章")}
            ${item("media", "媒體庫")}
            <div class="nav-label">客戶與設定</div>
            ${item("messages", "客戶查詢")}
            ${item("settings", "品牌與搜尋")}
          </div>
          <div class="side-foot"><button class="link" id="logout">${icon.out}登出</button></div>
        </aside>
        <main class="pad">${body}</main>
      </div>`;
      app.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => route(b.dataset.go));
      app.querySelector("#logout").onclick = async () => { await api("/api/admin/logout", { method: "POST", body: "{}" }); location.reload(); };
    }

    function head(title, desc, actions) {
      return `<header class="page-head"><div><h1>${title}</h1>${desc ? `<p>${desc}</p>` : ""}</div><div class="actions">${actions || ""}</div></header>`;
    }

    async function route(name, extra) {
      if (name === "dash") return viewDash();
      if (name === "pages") return viewList("page");
      if (name === "posts") return viewList("post");
      if (name === "edit") return viewEdit(extra);
      if (name === "media") return viewMedia();
      if (name === "messages") return viewMessages();
      if (name === "settings") return viewSettings();
    }

    function loginView(error) {
      app.innerHTML = `<div class="login"><form class="login-card" id="login">
        <div class="brand-lockup"><img src="/logo.png" alt="Loopvity"></div>
        <p class="eyebrow">Admin</p>
        <h1>登入管理控制台</h1>
        <p class="help" style="margin-bottom:22px">管理網站內容、網誌與搜尋設定。變更儲存後會即時反映於前台。</p>
        ${error ? `<div class="banner err">${esc(error)}</div>` : ""}
        <div class="field"><label>帳戶名稱</label><input name="username" value="admin" autocomplete="username" required></div>
        <div class="field"><label>密碼</label><input name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn-primary btn-block" type="submit">登入</button>
      </form></div>`;
      app.querySelector("#login").onsubmit = async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try { await api("/api/admin/login", { method: "POST", body: JSON.stringify(body) }); boot(); }
        catch (err) { loginView(err.message); }
      };
    }

    async function viewDash() {
      const d = await api("/api/admin/dashboard");
      layout("dash", `
        ${head("概覽", "檢視網站內容狀態，並繼續處理尚未發佈的項目。")}
        <div class="stats">
          <div class="stat"><span>已建立頁面</span><b>${d.pages}</b></div>
          <div class="stat"><span>網誌文章</span><b>${d.posts}</b></div>
          <div class="stat"><span>草稿</span><b>${d.drafts}</b></div>
          <div class="stat"><span>未讀查詢</span><b>${d.unread}</b></div>
        </div>
        <section class="card">
          <div class="section-head"><h2>接上正式網域</h2><p>完成以下步驟後，即可在 Google Search Console 提交網站。</p></div>
          <ol class="steps">
            <li><span class="num">1</span><div>於「品牌與搜尋」填寫正式網址，例如 <code>https://loopvity.com</code>。</div></li>
            <li><span class="num">2</span><div>貼上 Search Console 提供的 HTML 標記驗證碼並儲存。</div></li>
            <li><span class="num">3</span><div>在 Search Console 提交網站地圖 <code>/sitemap.xml</code>。</div></li>
          </ol>
        </section>`);
    }

    function statusBadge(status) {
      return status === "draft" ? `<span class="badge warn">草稿</span>` : `<span class="badge ok">已發佈</span>`;
    }

    async function viewList(kind) {
      const data = await api("/api/admin/pages?kind=" + kind);
      const isPost = kind === "post";
      const items = data.items || [];
      const bySlug = new Map(items.map((p) => [p.slug, p]));
      const used = new Set();
      const groups = [];
      for (const page of items) {
        if (used.has(page.id)) continue;
        const partner = page.pair_slug ? bySlug.get(page.pair_slug) : null;
        if (partner && partner.id !== page.id && !used.has(partner.id) && (!partner.pair_slug || partner.pair_slug === page.slug)) {
          const zh = page.locale !== "en" ? page : partner;
          const en = page.locale === "en" ? page : partner;
          used.add(page.id); used.add(partner.id);
          groups.push({ pages: [zh, en] });
        } else {
          used.add(page.id);
          groups.push({ pages: [page] });
        }
      }
      const image = (page) => {
        const cover = String(page.cover || "");
        if (cover.startsWith("/") || cover.startsWith("http")) return `<img class="page-thumb" src="${esc(cover)}" alt="">`;
        return "";
      };
      const grip = `<svg viewBox="0 0 16 16"><circle cx="5" cy="3.5" r="1.15"/><circle cx="11" cy="3.5" r="1.15"/><circle cx="5" cy="8" r="1.15"/><circle cx="11" cy="8" r="1.15"/><circle cx="5" cy="12.5" r="1.15"/><circle cx="11" cy="12.5" r="1.15"/></svg>`;
      const line = (page) => `<div class="lang-line" data-locale="${page.locale === "en" ? "en" : "zh"}" ${page.locale === "en" ? "hidden" : ""}>
        <label class="pick-label"><input class="pick" type="checkbox" data-id="${page.id}" aria-label="選取 ${esc(page.slug)}"></label>
        <span class="lang-url">/${esc(page.slug)}.html</span>
        ${statusBadge(page.status)}
        <span class="actions"><button class="btn-secondary btn-sm" data-edit="${page.id}">編輯</button><a class="btn-secondary btn-sm" href="/${esc(page.slug)}.html" target="_blank">檢視前台</a></span>
      </div>`;
      const cards = groups.map((group, index) => {
        const zh = group.pages.find((p) => p.locale !== "en");
        const en = group.pages.find((p) => p.locale === "en");
        const lead = zh || en || group.pages[0];
        const titleZh = zh ? (zh.title || zh.slug) : "";
        const titleEn = en ? (en.title || en.slug) : "";
        return `<article class="page-card" data-index="${index}">
          ${isPost ? "" : `<button type="button" class="drag-handle" aria-label="按住拖動">${grip}</button>`}
          <div class="card-body">
            <div class="card-top">
              <div class="card-heading">
                ${image(lead)}
                <h3 data-zh="${esc(titleZh)}" data-en="${esc(titleEn)}">${esc(titleZh || titleEn)}</h3>
              </div>
            </div>
            <div class="lang-panel">${group.pages.map(line).join("")}</div>
          </div>
        </article>`;
      }).join("");
      layout(isPost ? "posts" : "pages", `
        ${head(isPost ? "網誌文章" : "頁面", isPost ? "用上方切換只看中文或 English。" : "用上方切換只看中文或 English。按住左側把手可拖動順序。",
          `<button class="btn-primary" id="create">${isPost ? "新增文章" : "新增頁面"}</button>`)}
        <div class="table-wrap">
        <label class="list-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="搜尋標題、網址或語言" aria-label="搜尋"></label>
        <div class="list-toolbar">
          <div class="lang-toggle" id="list-lang">
            <button type="button" class="on" data-list-lang="zh">中文</button>
            <button type="button" data-list-lang="en">EN</button>
          </div>
          <label class="pick-label"><input class="pick" type="checkbox" id="select-all"><span>全選</span></label>
          <button class="text-action" type="button" id="select-visible">選取顯示項目</button>
          <div class="select-bar" id="select-bar" hidden>
            <span class="muted" id="selected-count"></span>
            <button class="text-action" type="button" id="select-none">取消全選</button>
            <button class="btn-danger btn-sm" type="button" id="delete-selected">刪除</button>
          </div>
        </div>
        <div class="page-list">${cards || `<div class="empty">尚未建立${isPost ? "文章" : "頁面"}。</div>`}</div>
        </div>`);
      const picks = () => [...app.querySelectorAll(".lang-line")].filter((line) => !line.hidden && !line.closest(".page-card").hidden).map((line) => line.querySelector(".pick"));
      const applyListLang = (locale) => {
        app.querySelectorAll("#list-lang button").forEach((button) => button.classList.toggle("on", button.dataset.listLang === locale));
        app.querySelectorAll(".page-card").forEach((card) => {
          const heading = card.querySelector("h3");
          const line = card.querySelector(`.lang-line[data-locale="${locale}"]`);
          card.querySelectorAll(".lang-line").forEach((item) => {
            item.hidden = item.dataset.locale !== locale;
            const box = item.querySelector(".pick");
            if (box && item.hidden) box.checked = false;
          });
          card.hidden = !line;
          if (heading && line) heading.textContent = locale === "en" ? heading.dataset.en : heading.dataset.zh;
        });
        refreshCount();
      };
      app.querySelectorAll("#list-lang button").forEach((button) => button.onclick = () => applyListLang(button.dataset.listLang));
      const master = app.querySelector("#select-all");
      const refreshCount = () => {
        const all = picks();
        const n = all.filter((el) => el.checked).length;
        const bar = app.querySelector("#select-bar");
        const count = app.querySelector("#selected-count");
        if (bar) bar.hidden = !n;
        if (count) count.textContent = n ? `已選取 ${n} 項` : "";
        if (master) {
          master.checked = n > 0 && n === all.length;
          master.indeterminate = n > 0 && n < all.length;
        }
      };
      master.onchange = () => { picks().forEach((el) => { el.checked = master.checked; }); refreshCount(); };
      app.querySelector("#select-none").onclick = () => { picks().forEach((el) => { el.checked = false; }); refreshCount(); };
      app.querySelector("#select-visible").onclick = () => {
        app.querySelectorAll(".page-card").forEach((card) => {
          if (card.hidden) return;
          card.querySelectorAll(".pick").forEach((el) => { el.checked = true; });
        });
        refreshCount();
      };
      picks().forEach((el) => el.onchange = refreshCount);
      app.querySelector("#delete-selected").onclick = async () => {
        const ids = picks().filter((el) => el.checked).map((el) => el.dataset.id);
        if (!ids.length || !confirm(`刪除已選取的 ${ids.length} 項？刪除後無法從控制台復原。`)) return;
        for (const id of ids) await api("/api/admin/pages/" + id, { method: "DELETE" });
        viewList(kind);
      };
      app.querySelectorAll(".drag-handle").forEach((handle) => handle.onpointerdown = (start) => {
        if (start.button != null && start.button !== 0) return;
        start.preventDefault();
        const card = handle.closest(".page-card");
        const list = app.querySelector(".page-list");
        let dragging = false;
        const timer = setTimeout(() => { dragging = true; card.classList.add("dragging"); }, 280);
        const move = (event) => {
          if (!dragging) {
            if (Math.abs(event.clientY - start.clientY) > 8) clearTimeout(timer);
            return;
          }
          const cards = [...list.querySelectorAll(".page-card:not([hidden])")];
          const target = cards.find((item) => {
            if (item === card) return false;
            const rect = item.getBoundingClientRect();
            return event.clientY > rect.top && event.clientY < rect.bottom;
          });
          if (!target) return;
          const mid = target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
          target.parentNode.insertBefore(card, event.clientY < mid ? target : target.nextSibling);
        };
        const up = async () => {
          clearTimeout(timer);
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
          if (!dragging) return;
          card.classList.remove("dragging");
          const indexes = [...list.querySelectorAll(".page-card")].map((item) => Number(item.dataset.index));
          const order = indexes.map((index) => groups[index]);
          const payload = [];
          order.forEach((group, i) => group.pages.forEach((page) => payload.push({ id: page.id, sort_order: i })));
          await api("/api/admin/pages/reorder", { method: "POST", body: JSON.stringify({ items: payload }) });
          viewList(kind);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });
      app.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => route("edit", b.dataset.edit));
      app.querySelector("#create").onclick = () => route("edit", "new:" + kind);
      const search = app.querySelector("#search");
      search.oninput = () => {
        const q = search.value.trim().toLowerCase();
        app.querySelectorAll(".page-card").forEach((card) => {
          card.hidden = q && !card.textContent.toLowerCase().includes(q);
        });
      };
    }

    function dropField(label, name, url, help) {
      const raw = String(url || "");
      const src = raw.startsWith("/") || raw.startsWith("http") ? raw : "";
      const preview = src ? `<img src="${esc(src)}" alt="">` : `<span>拖放檔案到這裡，或點擊從電腦選擇</span>`;
      return `<div class="field"><label>${label}</label><div class="drop" data-drop="${name}"><input type="hidden" name="${name}" value="${esc(src || raw)}"><div class="drop-preview">${preview}</div></div>${help ? `<p class="help">${help}</p>` : ""}</div>`;
    }
    async function uploadMedia(file) {
      const fd = new FormData();
      fd.append("file", file);
      const res = await fetch("/api/admin/media", { method: "POST", body: fd });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "上傳失敗");
      return data;
    }
    function bindDrops(root) {
      root.querySelectorAll("[data-drop]").forEach((zone) => {
        const input = zone.querySelector('input[type="hidden"]');
        const preview = zone.querySelector(".drop-preview");
        const apply = (data) => {
          input.value = data.url;
          preview.innerHTML = data.kind === "video" ? `<video src="${esc(data.url)}" controls></video>` : `<img src="${esc(data.url)}" alt="">`;
        };
        const take = async (file) => { if (!file) return; try { apply(await uploadMedia(file)); } catch (err) { alert(err.message); } };
        zone.onclick = () => {
          const picker = document.createElement("input");
          picker.type = "file";
          picker.accept = "image/*,video/*";
          picker.onchange = () => take(picker.files[0]);
          picker.click();
        };
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add("over"); };
        zone.ondragleave = () => zone.classList.remove("over");
        zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove("over"); take(e.dataTransfer.files[0]); };
      });
    }
    function field(label, name, value, type = "text", help) {
      const helpHtml = help ? `<p class="help">${help}</p>` : "";
      if (type === "area" || type === "code") {
        return `<div class="field"><label>${label}</label><textarea class="${type === "code" ? "code" : ""}" name="${name}">${esc(value)}</textarea>${helpHtml}</div>`;
      }
      return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}">${helpHtml}</div>`;
    }

    async function viewEdit(id) {
      const creating = String(id).startsWith("new:");
      const kind = creating ? id.slice(4) : null;
      const page = creating ? {
        kind, locale: "zh", status: "published", robots: "index,follow", show_in_nav: 0,
        content_html: "", sections_json: "[]",
        main_class: "flex-1 w-full", published_at: new Date().toISOString().slice(0, 10), cover: ""
      } : await api("/api/admin/pages/" + id);
      const isPost = page.kind === "post";
      let partner = null;
      if (!creating && page.pair_slug) {
        const list = await api("/api/admin/pages?kind=" + page.kind);
        partner = (list.items || []).find((item) => item.slug === page.pair_slug) || null;
      }
      const managed = creating || String(page.content_html || "").includes("<!--CMS_SECTIONS-->");
      let sections = [];
      try { sections = JSON.parse(page.sections_json || "[]"); } catch { sections = []; }
      if (!Array.isArray(sections)) sections = [];
      layout(isPost ? "posts" : "pages", `
        <button type="button" class="back btn-plain" id="back">← 返回${isPost ? "文章" : "頁面"}列表</button>
        ${head(creating ? (isPost ? "新增文章" : "新增頁面") : esc(page.title || "編輯內容"), creating ? "先寫正文，或到「HTML」貼上完整內容。兩邊都有內容時，儲存會先問要用哪一份。" : (managed ? "先寫正文。網址、分類和搜尋資料在「設定」。前台只跟這份正文。" : "原有版面會保留。這裡寫的內容會接在頁面底部。"))}
        <div id="err"></div>
        <form id="editor">
        <div class="editor-tabs">
          <button type="button" class="on" data-pane="write">撰寫</button>
          <button type="button" data-pane="html">HTML</button>
          <button type="button" data-pane="settings">設定</button>
        </div>
        <div id="pane-settings" hidden>
        <section class="card">
          <div class="section-head"><h2>基本資料</h2><p>標題會用於頁面主標題；網址別名決定前台路徑。</p></div>
          <div class="row">${field("標題", "title", page.title)}${field("網址別名", "slug", page.slug, "text", "只可使用小寫英文、數字與連字號。")}</div>
          <div class="row">
            <div class="field"><label>語言</label><select name="locale"><option value="zh" ${page.locale !== "en" ? "selected" : ""}>繁體中文</option><option value="en" ${page.locale === "en" ? "selected" : ""}>English</option></select></div>
            <div class="field"><label>發佈狀態</label><select name="status"><option value="published" ${page.status !== "draft" ? "selected" : ""}>已發佈</option><option value="draft" ${page.status === "draft" ? "selected" : ""}>草稿</option></select><p class="help">草稿不會出現在前台或網站地圖。</p></div>
          </div>
          ${isPost ? `<div class="row">${field("分類", "category", page.category)}${field("發佈日期", "published_at", page.published_at)}</div>${dropField("封面", "cover", page.cover, "拖放圖片或影片到這裡，或從電腦選擇。列表沒有媒體時會顯示文字封面。")}${field("摘要", "excerpt", page.excerpt, "area", "顯示於網誌列表與首頁卡片。")}` : `<div class="row three">${field("導覽列標籤", "nav_label", page.nav_label)}${field("排序", "sort_order", page.sort_order || 0, "number")}<div class="field"><label>主導覽</label><select name="show_in_nav"><option value="0" ${page.show_in_nav ? "" : "selected"}>不顯示</option><option value="1" ${page.show_in_nav ? "selected" : ""}>顯示於導覽列</option></select></div></div>`}
          ${field("對應語言頁面", "pair_slug", page.pair_slug, "text", "填寫另一語言版本的網址別名，用於語言切換。")}
        </section>
        <section class="card">
          <div class="section-head"><h2>搜尋引擎最佳化</h2><p>網頁標題會顯示在瀏覽器分頁、網站圖示的右側。留空時採用「標題 | 品牌名稱」。</p></div>
          ${field("網頁標題", "meta_title", page.meta_title)}
          ${field("網頁描述", "meta_description", page.meta_description, "area")}
          ${dropField("社交分享圖片", "og_image", page.og_image, "拖放圖片到這裡，或從電腦選擇。分享到社交平台時使用。")}
          ${field("標準網址", "canonical", page.canonical, "text", "留空則以正式網域自動產生。")}
          <div class="field"><label>索引設定</label><select name="robots"><option value="index,follow" ${page.robots !== "noindex,nofollow" ? "selected" : ""}>允許索引</option><option value="noindex,nofollow" ${page.robots === "noindex,nofollow" ? "selected" : ""}>不索引</option></select></div>
        </section>
        </div>
        <section class="card doc-card" id="pane-write">

        const filled = sections.filter((s) => {
          if (s.type === "text" || s.type === "heading" || s.type === "quote") return String(s.text || "").trim() && s.text !== "/";
          if (s.type === "list") return (s.items || []).some((item) => String(item).trim());
          if (s.type === "image" || s.type === "video") return !!s.url;
          return s.type === "table" || s.type === "divider";
        });
        const html = String(body.content_html || "").trim();
        body.use_html = false;
        body.sections = filled;
        if (html && filled.length) {
          const choice = await new Promise((resolve) => {
            const modal = app.querySelector("#source-modal");
            modal.hidden = false;
            const done = (value) => { modal.hidden = true; resolve(value); };
            app.querySelector("#use-body").onclick = () => done("body");
            app.querySelector("#use-html").onclick = () => done("html");
            app.querySelector("#source-cancel").onclick = () => done("");
          });
          if (!choice) return;
          body.use_html = choice === "html";
        } else if (html) body.use_html = true;
        if (body.use_html) body.sections = [];
        else delete body.content_html;
        const sectionFilled = (list) => (list || []).filter((s) => {
          if (s.type === "text" || s.type === "heading" || s.type === "quote") return String(s.text || "").trim() && s.text !== "/";
          if (s.type === "list") return (s.items || []).some((item) => String(item).trim());
          if (s.type === "image" || s.type === "video") return !!s.url;
          return s.type === "table" || s.type === "divider";
        });
        try {
          if (creating) {
            captureDraft(editLocale);
            const ready = ["zh", "en"].filter((locale) => {
              const draft = drafts[locale];
              return String(draft.values.title || "").trim() || String(draft.html || "").trim() || sectionFilled(draft.sections).length;
            });
            if (ready.length === 2) {
              let zhSlug = slugify(drafts.zh.values.slug || drafts.zh.values.title);
              let enSlug = slugify(drafts.en.values.slug || "");
              if (!zhSlug) { showErr("請先為中文頁填寫網址別名。"); return; }
              if (!enSlug) enSlug = zhSlug + "-en";
              const postDraft = async (locale, slug, pair) => {
                const draft = drafts[locale];
                const payload = Object.fromEntries(new FormData(form).entries());
                localeFields.forEach((name) => { if (draft.values[name] != null) payload[name] = draft.values[name]; });
                payload.locale = locale;
                payload.slug = slug;
                payload.pair_slug = pair;
                payload.kind = page.kind;
                payload.show_in_nav = payload.show_in_nav === "1";
                const secs = sectionFilled(draft.sections);
                const htmlText = String(draft.html || "").trim();
                if (htmlText && !secs.length) { payload.use_html = true; payload.content_html = htmlText; payload.sections = []; }
                else { payload.use_html = false; payload.sections = secs; delete payload.content_html; }
                return api("/api/admin/pages", { method: "POST", body: JSON.stringify(payload) });
              };
              await postDraft("zh", zhSlug, enSlug);
              await postDraft("en", enSlug, zhSlug);
              route(isPost ? "posts" : "pages");
              return;
            }
            if (ready.length === 1 && ready[0] !== editLocale) {
              applyDraft(ready[0]);
              editLocale = ready[0];
              const draft = drafts[editLocale];
              localeFields.forEach((name) => { if (draft.values[name] != null) body[name] = draft.values[name]; });
              body.locale = editLocale;
              body.sections = sectionFilled(draft.sections);
              const htmlText = String(draft.html || "").trim();
              body.use_html = !!htmlText && !body.sections.length;
              if (body.use_html) body.content_html = htmlText;
              else delete body.content_html;
            }
            await api("/api/admin/pages", { method: "POST", body: JSON.stringify(body) });
            route(isPost ? "posts" : "pages");
          } else {
            await api("/api/admin/pages/" + page.id, { method: "PUT", body: JSON.stringify(body) });
            showErr("變更已儲存，前台已更新。", true);
          }
        } catch (err) { showErr(err.message); }
      };
      const del = app.querySelector("#del");
      if (del) del.onclick = async () => {
        if (!confirm("刪除後無法從控制台復原。確定要刪除？")) return;
        await api("/api/admin/pages/" + page.id, { method: "DELETE" });
        route(isPost ? "posts" : "pages");
      };
      function showErr(message, ok) {
        app.querySelector("#err").innerHTML = `<div class="banner ${ok ? "ok" : "err"}">${esc(message)}</div>`;
      }
    }
    async function viewMedia() {
      const data = await api("/api/admin/media");
      const cards = data.items.map((m) => {
        const visual = (m.kind === "video" || String(m.mime).startsWith("video/"))
          ? `<video src="${esc(m.url)}" controls></video>`
          : `<img src="${esc(m.url)}" alt="">`;
        return `<article class="media-card">${visual}<p>${esc(m.filename || m.url)}</p></article>`;
      }).join("");
      layout("media", `
        ${head("媒體庫", "圖片與影片會存放在 Cloudflare R2，供頁面、文章與封面使用。客戶查詢則存放在 D1 資料庫。")}
        <div class="drop" id="library-drop" style="margin-bottom:20px"><span>拖放圖片或影片到這裡，或點擊從電腦選擇</span></div>
        ${cards ? `<div class="media-grid">${cards}</div>` : `<div class="card empty">尚未上傳媒體。</div>`}`);
      const zone = app.querySelector("#library-drop");
      const take = async (file) => {
        if (!file) return;
        try { await uploadMedia(file); viewMedia(); } catch (err) { alert(err.message); }
      };
      zone.onclick = () => {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*,video/*";
        picker.onchange = () => take(picker.files[0]);
        picker.click();
      };
      zone.ondragover = (e) => { e.preventDefault(); zone.classList.add("over"); };
      zone.ondragleave = () => zone.classList.remove("over");
      zone.ondrop = (e) => { e.preventDefault(); zone.classList.remove("over"); take(e.dataTransfer.files[0]); };
    }

    async function viewMessages() {
      const data = await api("/api/admin/messages");
      const rows = data.items.map((m) => `<tr>
        <td class="muted">${esc(m.created_at.slice(0, 16).replace("T", " "))}</td>
        <td><div class="title-cell">${esc(m.name || "未提供姓名")}</div><div class="muted">${esc(m.email)}</div></td>
        <td>${esc(m.topic || "—")}</td>
        <td>${esc(m.body)}</td>
        <td>${m.is_read ? `<span class="badge neutral">已讀</span>` : `<button class="btn-secondary btn-sm" data-read="${m.id}">標示為已讀</button>`}</td>
      </tr>`).join("");
      layout("messages", `
        ${head("客戶查詢", "前台聯絡表單提交的內容會集中在此。")}
        <div class="table-wrap"><table>
          <thead><tr><th>收到時間</th><th>聯絡人</th><th>查詢類型</th><th>內容</th><th>狀態</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5"><div class="empty">目前沒有客戶查詢。</div></td></tr>`}</tbody>
        </table></div>`);
      app.querySelectorAll("[data-read]").forEach((b) => b.onclick = async () => { await api("/api/admin/messages/" + b.dataset.read + "/read", { method: "POST", body: "{}" }); viewMessages(); });
    }

    async function viewSettings() {
      const s = await api("/api/admin/settings");
      layout("settings", `
        <form id="settings">
          ${head("品牌與搜尋", "這些設定套用至整個網站，包括瀏覽器分頁、標誌與搜尋引擎資料。", `<button class="btn-primary">儲存設定</button>`)}
          <div id="err"></div>
          <section class="card">
            <div class="section-head"><h2>品牌識別</h2><p>品牌名稱會出現在瀏覽器分頁、網站圖示右側。個別頁面若已填寫網頁標題，則以該標題為準。</p></div>
            ${field("品牌名稱", "site_name", s.site_name)}
            ${field("正式網址", "site_url", s.site_url, "text", "例：https://loopvity.com。用於標準網址與網站地圖。")}
            <div class="row">${dropField("品牌標誌", "logo_url", s.logo_url, "拖放或從電腦選擇。")}${dropField("網站圖示", "favicon_url", s.favicon_url, "顯示在瀏覽器分頁左側。")}</div>
          </section>
          <section class="card">
            <div class="section-head"><h2>聯絡資料</h2><p>更新後，導覽列、頁尾與頁面中的聯絡方式會一併替換。</p></div>
            <div class="row">${field("WhatsApp 連結", "whatsapp", s.whatsapp)}${field("支援電郵", "email", s.email)}</div>
            ${field("頁尾聲明", "footer_text", s.footer_text)}
          </section>
          <section class="card">
            <div class="section-head"><h2>搜尋與分析</h2><p>接上 Google Search Console 與 Analytics 後，搜尋表現可在 Google 後台查看。</p></div>
            ${field("預設網頁描述", "default_description", s.default_description, "area", "頁面未填寫描述時使用。")}
            ${field("Search Console 驗證碼", "google_verification", s.google_verification, "text", "只貼驗證碼本身，無需整段 meta 標籤。")}
            ${field("Analytics 評估 ID", "ga_id", s.ga_id, "text", "格式為 G- 開頭。")}
            ${field("robots.txt 附加規則", "robots_extra", s.robots_extra, "area")}
          </section>
        </form>
        <form id="password" class="card">
          <div class="section-head"><h2>帳戶安全</h2><p>請使用至少 8 個字元的密碼。更新後，下次登入即需使用新密碼。</p></div>
          ${field("新密碼", "password", "", "password")}
          <button class="btn-primary">更新密碼</button>
          <div id="pwerr" style="margin-top:12px"></div>
        </form>`);
      bindDrops(app.querySelector("#settings"));
      app.querySelector("#settings").onsubmit = async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try { await api("/api/admin/settings", { method: "PUT", body: JSON.stringify(body) }); app.querySelector("#err").innerHTML = `<div class="banner ok">設定已儲存。</div>`; }
        catch (err) { app.querySelector("#err").innerHTML = `<div class="banner err">${esc(err.message)}</div>`; }
      };
      app.querySelector("#password").onsubmit = async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try { await api("/api/admin/password", { method: "POST", body: JSON.stringify(body) }); app.querySelector("#pwerr").innerHTML = `<div class="banner ok">密碼已更新。</div>`; e.target.reset(); }
        catch (err) { app.querySelector("#pwerr").innerHTML = `<div class="banner err">${esc(err.message)}</div>`; }
      };
    }

    async function boot() {
      try { await api("/api/admin/me"); viewDash(); }
      catch { loginView(); }
    }
    boot();
  </script>
</body>
